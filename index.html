<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI | Study Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

       <div class="brand">

            <div class="brand-icon">✦</div>

            <div>
                <h2>Nova AI</h2>
                <p>Study Assistant</p>
            </div>
            <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>

        <button class="new-chat" onclick="clearChat()">
            ＋ New Chat
        </button>

        <div class="side-section">

            <p class="section-title">Study Topics</p>

            <button class="topic"
                    onclick="quickMessage('Tell me about Python')">
                🐍 Python
            </button>

            <button class="topic"
                    onclick="quickMessage('Tell me about Java')">
                ☕ Java
            </button>

            <button class="topic"
                    onclick="quickMessage('Tell me about HTML')">
                🌐 HTML
            </button>

            <button class="topic"
                    onclick="quickMessage('Tell me about CSS')">
                🎨 CSS
            </button>

            <button class="topic"
                    onclick="quickMessage('Tell me about Flask')">
                🚀 Flask
            </button>

        </div>

        <div class="online">
            <span></span>
            Nova AI is online
        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <button class="icon-btn menu-btn"
                    onclick="toggleSidebar()">
                ☰
            </button>

            <div>
                <h3>Nova AI</h3>
                <small>Study Assistant</small>
            </div>

            <div class="top-actions">

                <button class="icon-btn"
                        onclick="toggleTheme()">
                    ☾
                </button>

                <button class="icon-btn"
                        onclick="clearChat()">
                    ＋
                </button>

            </div>

        </header>


        <section class="chat-area" id="chatBox">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>
                    How can I help you today?
                </h1>

                <p>
                    Ask me about programming, web development
                    and computer science topics.
                </p>


                <div class="suggestions">

                    <button onclick="quickMessage('What is Python?')">
                        🐍 What is Python?
                    </button>

                    <button onclick="quickMessage('What is Java?')">
                        ☕ What is Java?
                    </button>

                    <button onclick="quickMessage('What is HTML and CSS?')">
                        🌐 What is HTML and CSS?
                    </button>

                    <button onclick="quickMessage('What is OOP?')">
                        📚 What is OOP?
                    </button>

                </div>

            </div>


            <div class="message bot">

                <div class="avatar">
                    ✦
                </div>

                <div class="message-content">

                    <div class="message-head">
                        <strong>Nova AI</strong>
                        <span class="time">Now</span>
                    </div>

                    <div class="bubble">
                        Hello! 👋 I'm Nova AI.
                        Ask me anything about your study topics.
                    </div>

                </div>

            </div>

        </section>


        <form class="input-area" id="chatForm">

            <input
                id="messageInput"
                type="text"
                placeholder="Ask Nova AI anything..."
                autocomplete="off">

            <button type="submit">
                ➤
            </button>

        </form>

    </main>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
